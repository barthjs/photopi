services:
  photopi:
    build:
      context: .
      target: prod
    pull_policy: never
    image: ghcr.io/barthjs/photopi:staging
    container_name: photopi-staging
    restart: unless-stopped
    privileged: true
    ports:
      - 8080:8080
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data:/data
    env_file: .env
